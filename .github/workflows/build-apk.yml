name: Build Android APK
on:
  push:
    branches: [main, 'fix/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Configure persistent debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Missing repository secret ANDROID_DEBUG_KEYSTORE_BASE64. Add the persistent Android debug keystore as a Base64-encoded GitHub Actions secret."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: auto-wifi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Auto Wi-Fi Debug APK build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
